<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coulomb — Electrostatic Field Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E17;
    --panel:#121826;
    --panel-border:#212B3D;
    --grid:#182236;
    --pos:#FF6B4A;
    --neg:#4AA8FF;
    --field:#5EEAD4;
    --field-dim:#5EEAD433;
    --text:#E6EDF7;
    --text-dim:#7A8BA6;
    --accent:#5EEAD4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; width:100vw;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
    flex-shrink:0;
    z-index:10;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em;
    color:var(--field);
    border:1px solid var(--field-dim);
    padding:2px 6px; border-radius:3px;
  }
  .brand-title{
    font-size:16px; font-weight:600; letter-spacing:-0.01em;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--text-dim);
  }
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  button, .toggle{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px; font-weight:500;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  button:hover, .toggle:hover{
    border-color:var(--text-dim);
    color:var(--text);
  }
  button.active, .toggle.active{
    background:var(--field-dim);
    border-color:var(--field);
    color:var(--field);
  }
  button.pos-btn{ border-color:#FF6B4A55; color:var(--pos); }
  button.pos-btn.active, button.pos-btn:hover{ background:#FF6B4A22; border-color:var(--pos); color:var(--pos); }
  button.neg-btn{ border-color:#4AA8FF55; color:var(--neg); }
  button.neg-btn.active, button.neg-btn:hover{ background:#4AA8FF22; border-color:var(--neg); color:var(--neg); }
  button.clear-btn:hover{ border-color:#FF6B4A; color:#FF6B4A; }

  main{
    position:relative; flex:1; min-height:0;
  }
  canvas{
    display:block; width:100%; height:100%;
    cursor:crosshair;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }

  .panel{
    position:absolute;
    background:rgba(18,24,38,0.92);
    border:1px solid var(--panel-border);
    border-radius:8px;
    backdrop-filter:blur(6px);
    font-family:'IBM Plex Mono', monospace;
  }
  #readout{
    left:16px; bottom:16px;
    padding:12px 16px;
    min-width:240px;
  }
  #readout .row{
    display:flex; justify-content:space-between; gap:16px;
    font-size:12px; padding:2px 0;
    color:var(--text-dim);
  }
  #readout .row span.val{
    color:var(--field);
    font-weight:500;
  }
  #readout .row.head{
    color:var(--text);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:6px; margin-bottom:4px;
    color:var(--text-dim);
  }

  #legend{
    right:16px; bottom:16px;
    padding:10px 14px;
    font-size:11px;
    color:var(--text-dim);
    line-height:1.7;
  }
  #legend .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:6px;
  }

  #hint{
    top:16px; left:50%; transform:translateX(-50%);
    padding:8px 16px;
    font-size:11.5px;
    color:var(--text-dim);
    font-family:'IBM Plex Sans', sans-serif;
    pointer-events:none;
    transition:opacity .4s ease;
  }

  .input-group{
    display:flex; align-items:center; gap:6px;
    padding:0 4px;
  }
  .input-group label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--text-dim);
  }
  .input-group input, .input-group select{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:4px 6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    outline:none;
  }
  .input-group input:focus, .input-group select:focus{
    border-color:var(--field);
  }
  .divider{
    width:1px; height:22px; background:var(--panel-border);
    margin:0 4px;
  }

  @media (max-width:820px){
    header{ flex-direction:column; align-items:stretch; gap:10px; }
    .toolbar{ justify-content:center; }
    .brand{ justify-content:center; }
    #legend{ display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-mark">E&nbsp;FIELD</span>
      <span class="brand-title">Coulomb</span>
      <span class="brand-sub">/ electrostatic field visualizer</span>
    </div>
    <div class="toolbar">
      <button id="btnPos" class="pos-btn active">+ charge</button>
      <button id="btnNeg" class="neg-btn">− charge</button>
      
      <!-- EXACT NUMERIC VALUE & PREFIX SELECTION -->
      <div class="input-group">
        <label for="qVal">|q| =</label>
        <input type="number" id="qVal" value="5" min="0.001" step="0.1" style="width: 55px;">
        <select id="qUnit">
          <option value="1e-12">pC</option>
          <option value="1e-9" selected>nC</option>
          <option value="1e-6">μC</option>
          <option value="1e-3">mC</option>
          <option value="1">C</option>
        </select>
      </div>

      <!-- DISTANCE SCALE SELECTION -->
      <div class="input-group">
        <label for="distScale">100px =</label>
        <select id="distScale">
          <option value="1e-3">1 mm</option>
          <option value="1e-2" selected>1 cm</option>
          <option value="1">1 m</option>
        </select>
      </div>

      <div class="divider"></div>
      <button id="btnLines" class="active">field lines</button>
      <button id="btnHeat">magnitude</button>
      <button id="btnTest">test charge</button>
      <div class="divider"></div>
      <button id="btnClear" class="clear-btn">clear</button>
    </div>
  </header>
  <main>
    <canvas id="canvas"></canvas>
    <div class="panel" id="hint">click canvas to place a charge · drag to move · alt-click to delete</div>
    <div class="panel" id="readout">
      <div class="row head"><span>cursor readout</span></div>
      <div class="row"><span>position</span><span class="val" id="rPos">—</span></div>
      <div class="row"><span>|E| field</span><span class="val" id="rMag">—</span></div>
      <div class="row"><span>direction</span><span class="val" id="rDir">—</span></div>
      <div class="row"><span>potential V</span><span class="val" id="rPot">—</span></div>
    </div>
    <div class="panel" id="legend">
      <div><span class="dot" style="background:#FF6B4A"></span>positive charge</div>
      <div><span class="dot" style="background:#4AA8FF"></span>negative charge</div>
      <div><span class="dot" style="background:#5EEAD4"></span>field line (flow → )</div>
    </div>
  </main>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // CONSTANTS
  const REAL_K = 8.98755e9; // Real Coulomb's Constant (N·m²/C²)
  const VISUAL_K = 8990;   // Normalized K constant for standard canvas rendering

  let charges = []; // {x, y, qCoulombs, displayVal, displayUnit, id}
  let nextId = 1;
  let mode = 'pos';
  let showLines = true;
  let showHeat = false;
  let showTest = false;
  let testCharge = null;
  let dragging = null;
  let mouse = {x:-9999, y:-9999};
  let flowOffset = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Helper: Format large/small physical numbers cleanly with standard engineering units
  function formatSI(num, unit) {
    if (Math.abs(num) === 0) return `0 ${unit}`;
    const abs = Math.abs(num);
    if (abs >= 1e9)  return `${(num / 1e9).toFixed(2)} G${unit}`;
    if (abs >= 1e6)  return `${(num / 1e6).toFixed(2)} M${unit}`;
    if (abs >= 1e3)  return `${(num / 1e3).toFixed(2)} k${unit}`;
    if (abs >= 1)    return `${num.toFixed(2)} ${unit}`;
    if (abs >= 1e-3) return `${(num * 1e3).toFixed(2)} m${unit}`;
    if (abs >= 1e-6) return `${(num * 1e6).toFixed(2)} μ${unit}`;
    if (abs >= 1e-9) return `${(num * 1e9).toFixed(2)} n${unit}`;
    return `${(num * 1e12).toFixed(2)} p${unit}`;
  }

  // Visual Field Calculation (Pixel Space)
  function visualFieldAt(x, y, excludeId){
    let ex = 0, ey = 0, v = 0;
    for(const c of charges){
      if(c.id === excludeId) continue;
      const dx = x - c.x, dy = y - c.y;
      const r2 = dx*dx + dy*dy;
      const r = Math.sqrt(r2);
      if(r < 6) continue;
      
      // Normalized visual charge magnitude (-10 to +10 range for visual rendering)
      const visQ = (c.qCoulombs > 0 ? 1 : -1) * c.visualMag;
      const e = VISUAL_K * visQ / r2;
      ex += e * dx / r;
      ey += e * dy / r;
      v += VISUAL_K * visQ / r;
    }
    return {ex, ey, v};
  }

  // Exact Physical SI Field Calculation
  function physicalFieldAt(px, py){
    let ex = 0, ey = 0, v = 0;
    
    // Scale: distance in meters per pixel
    const metersPer100Px = parseFloat(document.getElementById('distScale').value);
    const metersPerPx = metersPer100Px / 100;

    for(const c of charges){
      const dx = (px - c.x) * metersPerPx;
      const dy = (py - c.y) * metersPerPx;
      const r2 = dx*dx + dy*dy;
      const r = Math.sqrt(r2);
      if(r === 0) continue;

      const e = REAL_K * c.qCoulombs / r2;
      ex += e * dx / r;
      ey += e * dy / r;
      v += REAL_K * c.qCoulombs / r;
    }
    return {ex, ey, v, metersPerPx};
  }

  function traceStreamline(startX, startY, sign){
    const pts = [];
    let x = startX, y = startY;
    const step = 6;
    const maxSteps = 400;
    const rect = canvas.getBoundingClientRect();
    for(let i=0;i<maxSteps;i++){
      pts.push({x,y});
      const {ex,ey} = visualFieldAt(x,y);
      const mag = Math.hypot(ex,ey);
      if(mag < 1e-6) break;
      x += sign * step * ex/mag;
      y += sign * step * ey/mag;
      if(x < -20 || x > rect.width+20 || y < -20 || y > rect.height+20) { pts.push({x,y}); break; }
      
      let hit = false;
      for(const c of charges){
        if(Math.hypot(x-c.x, y-c.y) < 14){ hit = true; break; }
      }
      if(hit) break;
    }
    return pts;
  }

  function drawGrid(){
    const rect = canvas.getBoundingClientRect();
    const spacing = 32;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=0; x<rect.width; x+=spacing){
      ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5, rect.height);
    }
    for(let y=0; y<rect.height; y+=spacing){
      ctx.moveTo(0,y+0.5); ctx.lineTo(rect.width, y+0.5);
    }
    ctx.stroke();
  }

  function drawHeat(){
    const rect = canvas.getBoundingClientRect();
    const cell = 10;
    if(charges.length === 0) return;
    for(let x=0; x<rect.width; x+=cell){
      for(let y=0; y<rect.height; y+=cell){
        const {ex,ey} = visualFieldAt(x+cell/2, y+cell/2);
        const mag = Math.hypot(ex,ey);
        const t = Math.min(1, Math.log(1+mag/40) / 6);
        if(t < 0.02) continue;
        ctx.fillStyle = `rgba(94,234,212,${t*0.35})`;
        ctx.fillRect(x,y,cell,cell);
      }
    }
  }

  function drawFieldLines(){
    if(charges.length === 0) return;
    const N = 16;
    ctx.lineWidth = 1.4;
    for(const c of charges){
      if(c.qCoulombs === 0 || c.qCoulombs < 0) continue;
      for(let i=0;i<N;i++){
        const angle = (i/N) * Math.PI * 2;
        const sx = c.x + Math.cos(angle)*12;
        const sy = c.y + Math.sin(angle)*12;
        const pts = traceStreamline(sx, sy, 1);
        if(pts.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for(let p=1;p<pts.length;p++) ctx.lineTo(pts[p].x, pts[p].y);
        const grad = ctx.createLinearGradient(pts[0].x,pts[0].y,pts[pts.length-1].x,pts[pts.length-1].y);
        grad.addColorStop(0, 'rgba(94,234,212,0.85)');
        grad.addColorStop(1, 'rgba(94,234,212,0.08)');
        ctx.strokeStyle = grad;
        ctx.setLineDash([5,4]);
        ctx.lineDashOffset = -flowOffset;
        ctx.stroke();
        ctx.setLineDash([]);

        const mid = pts[Math.min(pts.length-1, Math.floor(pts.length*0.35))];
        const midNext = pts[Math.min(pts.length-1, Math.floor(pts.length*0.35)+2)];
        if(mid && midNext){
          const ang = Math.atan2(midNext.y-mid.y, midNext.x-mid.x);
          ctx.fillStyle = 'rgba(94,234,212,0.7)';
          ctx.save();
          ctx.translate(mid.x, mid.y);
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(4,0); ctx.lineTo(-3,-3); ctx.lineTo(-3,3);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  function drawCharges(){
    for(const c of charges){
      const isPos = c.qCoulombs > 0;
      const r = 10 + Math.min(12, c.visualMag * 1.5);
      const color = isPos ? '#FF6B4A' : '#4AA8FF';
      const glow = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r*2.4);
      glow.addColorStop(0, color+'55');
      glow.addColorStop(1, color+'00');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(c.x,c.y,r*2.4,0,Math.PI*2); ctx.fill();

      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#0A0E17';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = '#0A0E17';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(c.x-4, c.y); ctx.lineTo(c.x+4, c.y);
      if(isPos){ ctx.moveTo(c.x, c.y-4); ctx.lineTo(c.x, c.y+4); }
      ctx.stroke();

      // DISPLAY EXACT TYPED UNIT (e.g., +5 nC)
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = '#7A8BA6';
      ctx.textAlign = 'center';
      const signStr = isPos ? '+' : '-';
      ctx.fillText(`${signStr}${c.displayVal} ${c.displayUnit}`, c.x, c.y + r + 14);
    }
  }

  function drawTestCharge(){
    if(!showTest || !testCharge) return;
    const {ex,ey} = visualFieldAt(testCharge.x, testCharge.y, -1);
    const mag = Math.hypot(ex,ey);
    ctx.fillStyle = '#E6EDF7';
    ctx.beginPath(); ctx.arc(testCharge.x, testCharge.y, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5EEAD4'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(testCharge.x, testCharge.y, 6, 0, Math.PI*2); ctx.stroke();

    if(mag > 0.01){
      const scale = Math.min(70, 18*Math.log(1+mag/20));
      const ux = ex/mag, uy = ey/mag;
      const ex2 = testCharge.x + ux*scale, ey2 = testCharge.y + uy*scale;
      ctx.strokeStyle = '#E6EDF7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(testCharge.x, testCharge.y);
      ctx.lineTo(ex2, ey2);
      ctx.stroke();
      const ang = Math.atan2(ey2-testCharge.y, ex2-testCharge.x);
      ctx.save();
      ctx.translate(ex2,ey2);
      ctx.rotate(ang);
      ctx.fillStyle = '#E6EDF7';
      ctx.beginPath();
      ctx.moveTo(6,0); ctx.lineTo(-3,-4); ctx.lineTo(-3,4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function updateReadout(){
    const rPos = document.getElementById('rPos');
    const rMag = document.getElementById('rMag');
    const rDir = document.getElementById('rDir');
    const rPot = document.getElementById('rPot');

    if(mouse.x < -1000 || charges.length === 0){
      rPos.textContent = '—'; rMag.textContent = '—'; rDir.textContent = '—'; rPot.textContent = '—';
      return;
    }

    const {ex, ey, v, metersPerPx} = physicalFieldAt(mouse.x, mouse.y);
    const mag = Math.hypot(ex, ey);
    const dir = (Math.atan2(ey, ex) * 180 / Math.PI).toFixed(1);

    // Format position using current selected distance unit scale
    const distUnitLabel = document.getElementById('distScale').options[document.getElementById('distScale').selectedIndex].text.split(' ')[1];
    const xDist = (mouse.x * metersPerPx) / (parseFloat(document.getElementById('distScale').value) / 100);
    const yDist = (mouse.y * metersPerPx) / (parseFloat(document.getElementById('distScale').value) / 100);

    rPos.textContent = `(${xDist.toFixed(1)}, ${yDist.toFixed(1)}) ${distUnitLabel}`;
    rMag.textContent = formatSI(mag, 'N/C');
    rDir.textContent = `${dir}°`;
    rPot.textContent = formatSI(v, 'V');
  }

  function frame(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle = '#0A0E17';
    ctx.fillRect(0,0,rect.width,rect.height);
    drawGrid();
    if(showHeat) drawHeat();
    if(showLines) drawFieldLines();
    drawCharges();
    drawTestCharge();
    updateReadout();
    flowOffset = (flowOffset + 0.35) % 9999;
    requestAnimationFrame(frame);
  }

  // --- INTERACTION ---
  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    const t = evt.touches ? evt.touches[0] : evt;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function hitTest(x,y){
    for(let i=charges.length-1;i>=0;i--){
      const c = charges[i];
      const r = 10 + Math.min(12, c.visualMag * 1.5);
      if(Math.hypot(x-c.x,y-c.y) <= r+4) return c;
    }
    return null;
  }

  function createCharge(x, y) {
    const valInput = parseFloat(document.getElementById('qVal').value) || 1;
    const unitSelect = document.getElementById('qUnit');
    const unitMultiplier = parseFloat(unitSelect.value);
    const unitText = unitSelect.options[unitSelect.selectedIndex].text;
    
    const sign = mode === 'pos' ? 1 : -1;
    const qCoulombs = sign * valInput * unitMultiplier;
    
    // Map visual magnitude smoothly (logarithmic visual scaling)
    const visualMag = Math.max(1, Math.min(10, Math.log10(valInput) * 2 + 4));

    return {
      x, y,
      qCoulombs,
      displayVal: valInput,
      displayUnit: unitText,
      visualMag,
      id: nextId++
    };
  }

  let didDrag = false;

  canvas.addEventListener('mousedown', (e)=>{
    const {x,y} = getPos(e);
    didDrag = false;
    const hit = hitTest(x,y);
    if(hit){
      if(e.altKey){
        charges = charges.filter(c=>c.id!==hit.id);
        return;
      }
      dragging = hit;
      return;
    }
    if(showTest && testCharge && Math.hypot(x-testCharge.x,y-testCharge.y) < 12){
      dragging = 'test';
      return;
    }
  });

  canvas.addEventListener('mousemove', (e)=>{
    const {x,y} = getPos(e);
    mouse = {x,y};
    if(dragging === 'test'){
      testCharge = {x,y}; didDrag = true;
    } else if(dragging){
      dragging.x = x; dragging.y = y; didDrag = true;
    }
  });

  window.addEventListener('mouseup', ()=>{ dragging = null; });
  canvas.addEventListener('mouseleave', ()=>{ mouse = {x:-9999,y:-9999}; });

  canvas.addEventListener('click', (e)=>{
    if(didDrag){ didDrag = false; return; }
    const {x,y} = getPos(e);
    if(hitTest(x,y)) return;
    if(showTest && !testCharge){
      testCharge = {x,y};
      return;
    }
    charges.push(createCharge(x, y));
    document.getElementById('hint').style.opacity = '0';
  });

  // Touch support
  canvas.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    const {x,y} = getPos(e);
    const hit = hitTest(x,y);
    if(hit){ dragging = hit; return; }
    charges.push(createCharge(x, y));
    document.getElementById('hint').style.opacity = '0';
