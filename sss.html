<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solid Sphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E17;
    --panel:#121826;
    --panel-border:#212B3D;
    --grid:#182236;
    --pos:#FF6B4A;
    --neg:#4AA8FF;
    --field:#5EEAD4;
    --field-dim:#5EEAD433;
    --text:#E6EDF7;
    --text-dim:#7A8BA6;
    --cond:#86c5da;
    --ins:#66b2ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ display:flex; flex-direction:column; height:100vh; width:100vw; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
    flex-shrink:0; z-index:10;
    flex-wrap:wrap; gap:8px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em;
    color:var(--field); border:1px solid var(--field-dim);
    padding:2px 6px; border-radius:3px;
  }
  .brand-title{ font-size:16px; font-weight:600; letter-spacing:-0.01em; }

  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px; font-weight:500;
    background:transparent; color:var(--text-dim);
    border:1px solid var(--panel-border); border-radius:6px;
    padding:7px 12px; cursor:pointer;
    transition:all .15s ease; white-space:nowrap;
  }
  button:hover{ border-color:var(--text-dim); color:var(--text); }
  button.active{ background:var(--field-dim); border-color:var(--field); color:var(--field); }
  button.pos-btn{ border-color:#FF6B4A55; color:var(--pos); }
  button.pos-btn.active, button.pos-btn:hover{ background:#FF6B4A22; border-color:var(--pos); color:var(--pos); }
  button.neg-btn{ border-color:#4AA8FF55; color:var(--neg); }
  button.neg-btn.active, button.neg-btn:hover{ background:#4AA8FF22; border-color:var(--neg); color:var(--neg); }
button.condSph:hover{ background:#FF6B4A22; border-color:var(--cond); }
button.insSph:hover{ background:#4AA8FF55 ; border-color:var(--ins); }

  .input-group{ display:flex; align-items:center; gap:6px; padding:0 4px; }
  .input-group label{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); }
  .input-group input, .input-group select{
    background:var(--bg); color:var(--text);
    border:1px solid var(--panel-border);
    border-radius:4px; padding:4px 6px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; outline:none;
  }
  .input-group input:focus, .input-group select:focus{ border-color:var(--field); }
  .divider{ width:1px; height:22px; background:var(--panel-border); margin:0 4px; }

  main{ position:relative; flex:1; min-height:0; }
  canvas{ display:block; width:100%; height:100%; cursor:crosshair; }

  .panel{
    position:absolute;
    background:rgba(18,24,38,0.92);
    border:1px solid var(--panel-border);
    border-radius:8px;
    backdrop-filter:blur(6px);
    font-family:'IBM Plex Mono', monospace;
  }

  /* READOUT */
  #readout{ right:16px; top:16px; padding:12px 16px; min-width:240px; }

  #readout .row{ display:flex; justify-content:space-between; gap:16px; font-size:12px; padding:2px 0; color:var(--text-dim); }

  #readout .row span.val{ color:var(--field); font-weight:500; }

  #readout .row.head{
    color:var(--text); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    border-bottom:1px solid var(--panel-border); padding-bottom:6px; margin-bottom:4px;
  }

  #readout .row span.inside{ color:var(--neg); font-weight:500; }

  #readout .row span.surface{ color:var(--field); font-weight:500; }

  #readout .row span.outside{ color:var(--pos); font-weight:500; }

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-mark">SS</span>
      <span class="brand-title">Solid Sphere</span>
    </div>
    <div class="toolbar">

      <!-- Charge magnitude -->
      <div class="input-group">
        <label>|Q| =</label>
        <input type="number" id="qVal" value="5" min="0.001" step="0.1" style="width:55px;">
        <select id="qUnit">
          <option value="1e-12">pC</option>
          <option value="1e-9" selected>nC</option>
          <option value="1e-6">μC</option>
          <option value="1e-3">mC</option>
          <option value="1">C</option>
        </select>
      </div>

      <!-- Charge sign -->
      <button id="btnPos" class="pos-btn active">+ charge</button>
      <button id="btnNeg" class="neg-btn">− charge</button>

      <!-- Radius -->
      <div class="input-group">
        <label>R =</label>
        <input type="number" id="rVal" value="100" min="20" max="400" step="5" style="width:60px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);">px</span>
      </div>

      <!-- Scale -->
      <div class="input-group">
        <label>100px =</label>
        <select id="distScale">
          <option value="1e-9">1 nm</option>
          <option value="1e-6">1 μm</option>
          <option value="1e-3">1 mm</option>
          <option value="1e-2" selected>1 cm</option>
          <option value="1">1 m</option>
        </select>
      </div>
      
      <!-- Type -->
      <button id="condSph" class="pos-btn active">C</button>
      <button id="insSph" class="neg-btn">I</button>
        

      <div class="divider"></div>
      <button id="btnLines" class="active">field lines</button>
      <button id="btnHeat">magnitude</button>
    </div>
  </header>

  <main>
    <canvas id="canvas"></canvas>

    <div class="panel" id="readout">
      <div class="row head"><span>cursor readout</span></div>
      <div class="row"><span>position</span><span class="val" id="rPos">—</span></div>
      <div class="row"><span>r from center</span><span class="val" id="rDist">—</span></div>
      <div class="row"><span>region</span><span class="val" id="rRegion">—</span></div>
      <div class="row"><span>|E| field</span><span class="val" id="rMag">—</span></div>
      <div class="row"><span>direction</span><span class="val" id="rDir">—</span></div>
      <div class="row"><span>potential V</span><span class="val" id="rPot">—</span></div>
    </div>
  </main>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const REAL_K = 8.98755e9;

  let sphere = {
    Q: 5e-9,
    Rpx: 100,
  };

  let sign = 1;  // +1 or -1
  let showLines = true;
  let showHeat  = false;
  let cond = true;
  let mouse = { x: -9999, y: -9999 };
  let flowOffset = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  // Canvas center (updated on resize)
  let cx = 0, cy = 0;

function resize(){
  const rect = canvas.getBoundingClientRect();
  if(rect.width === 0 || rect.height === 0) return; // skip bad layout passes
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = rect.width  / 2;
  cy = rect.height / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

  function getMetersPerPx(){
    return parseFloat(document.getElementById('distScale').value) / 100;
  }
  function getUnitLabel(){
    const s = document.getElementById('distScale');
    return s.options[s.selectedIndex].text.split(' ')[1];
  }

  function formatSI(num, unit){
    if(num === 0) return `0 ${unit}`;
    const abs = Math.abs(num);
    if(abs >= 1e9)  return `${(num/1e9).toFixed(2)} G${unit}`;
    if(abs >= 1e6)  return `${(num/1e6).toFixed(2)} M${unit}`;
    if(abs >= 1e3)  return `${(num/1e3).toFixed(2)} k${unit}`;
    if(abs >= 1)    return `${num.toFixed(2)} ${unit}`;
    if(abs >= 1e-3) return `${(num*1e3).toFixed(2)} m${unit}`;
    if(abs >= 1e-6) return `${(num*1e6).toFixed(2)} μ${unit}`;
    if(abs >= 1e-9) return `${(num*1e9).toFixed(2)} n${unit}`;
    return `${(num*1e12).toFixed(2)} p${unit}`;
  }


/* MATH */

function physicalFieldAt(px, py){
    const mPerPx = getMetersPerPx();
    const dx = (px - cx) * mPerPx;
    const dy = (py - cy) * mPerPx;
    const r  = Math.sqrt(dx*dx + dy*dy);
    const R  = sphere.Rpx * mPerPx;
    const Q  = sphere.Q;

    if(r < 1e-12) return { ex:0, ey:0, v: REAL_K * Q / R };

    if (cond) {
      if (r < R) {
        return { ex:0, ey:0, v: REAL_K * Q / R };
      } else {
        const r2 = r ** 2;
        const E = (REAL_K * Q) / r2;
        return {
          ex: (E * dx) / r,
          ey: (E * dy) / r,
          v: (REAL_K * Q) / r
        };
      }
    } else {
      if (r < R) {
        const r2 = r ** 2;
        const R2 = R ** 2;
        const R3 = R ** 3;
        const E = (REAL_K * Q * r) / R3;
        const V = ((REAL_K * Q) / (2 * R3)) * ((3 * R2) - r2);
        return {
          ex: (E * dx) / r,
          ey: (E * dy) / r,
          v: V
        };
      } else {
        const r2 = r ** 2;
        const E = (REAL_K * Q) / r2;
        return {
          ex: (E * dx) / r,
          ey: (E * dy) / r,
          v: (REAL_K * Q) / r
        };
      }
    }
  }


function visualFieldAt(px, py){
    const dx = px - cx, dy = py - cy;
    const rPx = Math.sqrt(dx*dx + dy*dy);
    if(rPx < 1e-6) return { ex:0, ey:0 };

    const visQ = sign * 1000;

    if (cond) {
      // conducting: no field inside
      if(rPx < sphere.Rpx) return { ex:0, ey:0 };
      const E = visQ / (rPx * rPx);
      return { ex: (E * dx) / rPx, ey: (E * dy) / rPx };
    } else {
   
      if(rPx < sphere.Rpx){
        const E = (visQ * rPx) / (sphere.Rpx ** 3);
        return { ex: (E * dx) / rPx, ey: (E * dy) / rPx };
      } else {
        const E = visQ / (rPx * rPx);
        return { ex: (E * dx) / rPx, ey: (E * dy) / rPx };
      }
    }
  }

  function traceStreamline(startX, startY, dir){
    const pts = [];
    let x = startX, y = startY;
    const step = 6, maxSteps = 500;
    const rect = canvas.getBoundingClientRect();

    for(let i = 0; i < maxSteps; i++){
      pts.push({ x, y });
      const { ex, ey } = visualFieldAt(x, y);
      const mag = Math.hypot(ex, ey);
      if(mag < 1e-9) break;
      x += dir * step * ex / mag;
      y += dir * step * ey / mag;
      if(x < -40 || x > rect.width+40 || y < -40 || y > rect.height+40){ pts.push({x,y}); break; }
      // Stop if we hit the shell surface (going inward)
      if(Math.hypot(x - cx, y - cy) < sphere.Rpx - 4) break;
    }
    return pts;
  }


/*DRAW*/
  function drawGrid(){
    const rect = canvas.getBoundingClientRect();
    ctx.strokeStyle = '#182236';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x = 0; x < rect.width; x += 32){
      ctx.moveTo(x+0.5, 0); ctx.lineTo(x+0.5, rect.height);
    }
    for(let y = 0; y < rect.height; y += 32){
      ctx.moveTo(0, y+0.5); ctx.lineTo(rect.width, y+0.5);
    }
    ctx.stroke();
  }

  function drawSphere(){
    const R = sphere.Rpx;
    const color = sign > 0 ? '#FF6B4A' : '#4AA8FF';
    const colorDim = sign > 0 ? 'rgba(255,107,74,0.4)' : 'rgba(74,168,255,0.4)';

    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = colorDim;
    ctx.fill();

    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    ctx.stroke();

    // Label
    const qLabel = formatSI(Math.abs(sphere.Q), 'C');
    const rLabel = formatSI(sphere.Rpx * getMetersPerPx(), 'm');
    ctx.font = "11px 'IBM Plex Mono', monospace";
    ctx.fillStyle = '#7A8BA6';
    ctx.textAlign = 'center';
    ctx.fillText(`Q = ${sign > 0 ? '+' : '−'}${qLabel}`, cx, cy + R + 20);
    ctx.fillText(`R = ${rLabel}`, cx, cy + R + 34);
  }

  function drawFieldLines(){
    const N = 16;
    const R = sphere.Rpx;
    ctx.lineWidth = 1.4;

    for(let i = 0; i < N; i++){
      const angle = (i / N) * Math.PI * 2;
      const sx = cx + Math.cos(angle) * (R + 8);
      const sy = cy + Math.sin(angle) * (R + 8);

      const pts = traceStreamline(sx, sy, sign > 0 ? 1 : -1);
      if(pts.length < 2) continue;

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let p = 1; p < pts.length; p++) ctx.lineTo(pts[p].x, pts[p].y);

      const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length-1].x, pts[pts.length-1].y);
      grad.addColorStop(0, 'rgba(94,234,212,0.85)');
      grad.addColorStop(1, 'rgba(94,234,212,0.06)');
      ctx.strokeStyle = grad;
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = sign > 0 ? -flowOffset : flowOffset;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawHeat(){
    const rect = canvas.getBoundingClientRect();
    const cell = 10;
    for(let x = 0; x < rect.width; x += cell){
      for(let y = 0; y < rect.height; y += cell){
        const { ex, ey } = visualFieldAt(x + cell/2, y + cell/2);
        const mag = Math.hypot(ex, ey);
        const t = Math.min(1, Math.log(1 + mag / 40) / 5);
        if(t < 0.02) continue;
        ctx.fillStyle = `rgba(94,234,212,${t * 0.35})`;
        ctx.fillRect(x, y, cell, cell);
      }
    }
  }

  function updateReadout(){
    const mPerPx   = getMetersPerPx();
    const unitScale = parseFloat(document.getElementById('distScale').value);
    const unitName  = getUnitLabel();

    if(mouse.x < -1000){
      ['rPos','rDist','rRegion','rMag','rDir','rPot'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
      return;
    }

    const { ex, ey, v } = physicalFieldAt(mouse.x, mouse.y);
    const mag  = Math.hypot(ex, ey);
    const dir  = (Math.atan2(ey, ex) * 180 / Math.PI).toFixed(1);

    // Position relative to canvas
    const xDist = ((mouse.x - cx) * mPerPx) / unitScale;
    const yDist = ((mouse.y - cy) * mPerPx) / unitScale;

    // Distance from center
    const rPx  = Math.hypot(mouse.x - cx, mouse.y - cy);
    const rM   = rPx * mPerPx;
    const rDisp = rM / unitScale;

    const isInside = rPx < sphere.Rpx;

    document.getElementById('rPos').textContent    = `(${xDist.toFixed(1)}, ${yDist.toFixed(1)}) ${unitName}`;
    document.getElementById('rDist').textContent   = `${rDisp.toFixed(2)} ${unitName}`;


  const regionEl = document.getElementById('rRegion');
    const tolPx = 0
    let regionLabel;
    if (Math.abs(rPx - sphere.Rpx) < tolPx) {
      regionLabel = '<span class="surface">on surface</span>';
    } else if (rPx < sphere.Rpx) {
      regionLabel = '<span class="inside">inside sphere</span>';
    } else {
      regionLabel = '<span class="outside">outside sphere</span>';
    }
    regionEl.innerHTML = regionLabel;

    document.getElementById('rMag').textContent = formatSI(mag, 'N/C');
    document.getElementById('rDir').textContent = isInside ? '—' : `${dir}°`;
    document.getElementById('rPot').textContent = formatSI(v, 'V');
  }

  document.getElementById('btnPos').addEventListener('click', () => {
    sign = 1;
    sphere.Q = Math.abs(sphere.Q);
    document.getElementById('btnPos').classList.add('active');
    document.getElementById('btnNeg').classList.remove('active');
  });
  document.getElementById('btnNeg').addEventListener('click', () => {
    sign = -1;
    sphere.Q = -Math.abs(sphere.Q);
    document.getElementById('btnNeg').classList.add('active');
    document.getElementById('btnPos').classList.remove('active');
  });

  function updateQ(){
    const qMag  = parseFloat(document.getElementById('qVal').value) || 1;
    const qUnit = parseFloat(document.getElementById('qUnit').value);
    sphere.Q = sign * qMag * qUnit;
  }
  document.getElementById('qVal').addEventListener('input', updateQ);
  document.getElementById('qUnit').addEventListener('change', updateQ);

  document.getElementById('rVal').addEventListener('input', () => {
    sphere.Rpx = parseFloat(document.getElementById('rVal').value) || 100;
  });

  document.getElementById('btnLines').addEventListener('click', () => {
    showLines = !showLines;
    document.getElementById('btnLines').classList.toggle('active', showLines);
  });
  document.getElementById('btnHeat').addEventListener('click', () => {
    showHeat = !showHeat;
    document.getElementById('btnHeat').classList.toggle('active', showHeat);
  });

document.getElementById('condSph').addEventListener('click', () => {
    cond = true;
     document.getElementById('condSph').classList.add('active');
    document.getElementById('insSph').classList.remove('active');
});


document.getElementById('insSph').addEventListener('click', () => {
    cond = false;
    document.getElementById('insSph').classList.add('active');
    document.getElementById('condSph').classList.remove('active');
});

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  });
  canvas.addEventListener('mouseleave', () => { mouse = { x: -9999, y: -9999 }; });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouse = { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }, { passive: false });
  canvas.addEventListener('touchend', () => { mouse = { x: -9999, y: -9999 }; });


  function frame(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = '#0A0E17';
    ctx.fillRect(0, 0, rect.width, rect.height);

    drawGrid();
    if(showHeat)  drawHeat();
    if(showLines) drawFieldLines();
    drawSphere();
    updateReadout();

    flowOffset = (flowOffset + 0.35) % 9999;
    requestAnimationFrame(frame);
  }
  frame();

})();
</script>
</body>
</html>
