<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Symmetrical Shapes in Electrostatics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E17;
    --panel: #121826;
    --panel-border: #212B3D;
    --field: #5EEAD4;
    --field-dim: #5EEAD422;
    --pos: #FF6B4A;
    --neg: #4AA8FF;
    --text: #E6EDF7;
    --text-dim: #7A8BA6;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--panel-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 48px;
  }

  /* Header */
  .header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--field);
    border: 1px solid var(--field-dim);
    background: #5EEAD40A;
    padding: 4px 10px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .title {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .title span {
    color: var(--field);
  }

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    max-width: 340px;
    line-height: 1.6;
    text-align: center;
  }

  /* Cards */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: min(480px, 92vw);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s ease;
    border-radius: 12px;
  }

  .card.active::before {
    background: radial-gradient(ellipse at top left, #5EEAD408, transparent 70%);
    opacity: 1;
  }

  .card.active:hover {
    border-color: var(--field);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px #5EEAD412;
  }

  .card.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .card.active .card-icon {
    background: #5EEAD414;
    border: 1px solid #5EEAD433;
  }

  .card.disabled .card-icon {
    background: #7A8BA614;
    border: 1px solid #7A8BA633;
  }

  .arrow {
    font-size: 18px;
    color: var(--field);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .card.active:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  .card-name {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .card-desc {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.65;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.06em;
  }

  .tag-teal { background: #5EEAD410; color: var(--field); border: 1px solid #5EEAD428; }
  .tag-pos  { background: #FF6B4A10; color: var(--pos);   border: 1px solid #FF6B4A28; }
  .tag-neg  { background: #4AA8FF10; color: var(--neg);   border: 1px solid #4AA8FF28; }
  .tag-dim  { background: #7A8BA610; color: var(--text-dim); border: 1px solid #7A8BA628; }

  /* Footer */
  .footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    opacity: 0.6;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <span class="badge"></span>
    <h1 class="title"></span></h1>
    <p class="subtitle"></p>
  </div>

  <div class="cards">
    <!-- Card 1: Hollow Spherical Sphere -->
    <a class="card active" href=".html">
      <div class="card-top">
        <div class="card-icon">⚛︎</div>
        <div class="arrow">→</div>
      </div>
      <div class="card-name">Hollow Spherical Shell</div>
      <div class="card-desc"></div>
      </a>

    <!-- Card 2: Solid Sphere -->
    <a class="card active" href=".html">
      <div class="card-top">
        <div class="card-icon">⚛︎</div>
        <div class="arrow">→</div>
      </div>
      <div class="card-name">Solid Sphere</div>
      <div class="card-desc"></div>
      </a>

    <!-- Card 3: Cylinder -->
    <a class="card active" href=".html">
      <div class="card-top">
        <div class="card-icon">⚛︎</div>
        <div class="arrow">→</div>
      </div>
      <div class="card-name">Infinite Line Charge</div>
      <div class="card-desc"></div>
      </a>

    <!-- Card 4: Infinite Plane -->
    <a class="card active" href=".html">
      <div class="card-top">
        <div class="card-icon">⚛︎</div>
        <div class="arrow">→</div>
      </div>
      <div class="card-name">Sheet</div>
      <div class="card-desc"></div>
      </a>
    </div>

  <div class="footer">built for interactive learning · electrostatics</div>

</div>
</body>
</html>
